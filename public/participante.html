<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participante - Ruleta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginScreen" class="screen">

        <div class="login-card">

            <div class="logo">🎡</div>

            <h1>ENTRAR A LA RULETA</h1>

            <p>
                Ingresa tu nombre y la clave proporcionada por el administrador.
            </p>

            <input
                id="participantName"
                type="text"
                maxlength="30"
                placeholder="Tu nombre"
            >

            <input
                id="accessKey"
                type="text"
                placeholder="Clave de acceso"
            >

            <button
                id="enterButton"
                class="main-button participant-button"
                type="button"
            >
                ENTRAR
            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </div>

    </div>


    <!-- =========================
         RULETA
    ========================== -->

    <div
        id="rouletteScreen"
        class="roulette-screen hidden">

        <!-- CABECERA -->

        <header class="topbar">

            <div class="live-title">
                🎡 <strong>RULETA EN VIVO</strong>
            </div>

            <div class="topbar-right">

                <div
                    id="myName"
                    class="my-name">
                </div>

<button
    id="refreshButton"
    class="header-button"
    type="button"
    title="Actualizar participantes">
    🔄
</button>

<span id="refreshStatus"></span>

                <button
                    id="logoutButton"
                    class="header-button logout-button"
                    type="button"
                    title="Salir">
                    🚪
                </button>

            </div>

        </header>


        <!-- CONTENIDO -->

        <main class="roulette-page">

            <div class="roulette-content">

                <!-- RULETA -->

                <div class="wheel-container">

                    <div class="pointer"></div>

                    <div
                        id="wheel"
                        class="wheel">
                    </div>

                </div>


                <!-- RESULTADO -->

<!-- VENTANA FLOTANTE DEL GANADOR -->

<div id="winnerOverlay" class="celebration-overlay">

    <div class="celebration-popup">

        <div class="celebration-trophy">
            🏆
        </div>

        <div class="celebration-title">
            🎉 ¡TENEMOS GANADOR! 🎉
        </div>

        <div id="winnerName" class="celebration-name">
            —
        </div>

        <div class="celebration-subtitle">
            ¡FELICIDADES! 🎊
        </div>

    </div>

</div>

                <!-- PARTICIPANTES -->

                <div class="participant-view-list">

                    <div class="participant-view-title">

                        <h2>
                            👥 PARTICIPANTES
                        </h2>

                        <span id="publicParticipantCount">
                            0
                        </span>

                    </div>


                    <div
                        id="publicParticipantsList"
                        class="public-participants-list">

                        <div class="empty">
                            Esperando participantes...
                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>


    <!-- SOCKET.IO -->

<script src="/socket.io/socket.io.js"></script>

<audio
    id="musicaFondo"
    src="/audio/fondo.mp3"
    loop
    preload="auto">
</audio>

<script src="/participante.js"></script>

</body>

</html>
