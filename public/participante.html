<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participante - Ruleta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="screen">
        <div class="login-card">
            <div class="logo">🎡</div>

            <h1>ENTRAR A LA RULETA</h1>

            <p>
                Ingresa tu nombre y la clave proporcionada por el administrador.
            </p>

            <input
                id="participantName"
                type="text"
                maxlength="30"
                placeholder="Tu nombre"
            >

            <input
                id="accessKey"
                type="text"
                placeholder="Clave de acceso"
            >

            <button
                id="enterButton"
                class="main-button participant-button"
            >
                ENTRAR
            </button>

            <div id="loginMessage" class="message"></div>
        </div>
    </div>


    <!-- RULETA -->
    <div id="rouletteScreen" class="roulette-screen hidden">

        <!-- CABECERA SIEMPRE ARRIBA -->
        <header class="topbar">

            <div class="live-title">
                🎡 <strong>RULETA EN VIVO</strong>
            </div>

            <div class="topbar-right">

                <div id="myName" class="my-name"></div>

                <button
                    id="refreshButton"
                    class="header-button"
                    title="Actualizar"
                >
                    🔄
                </button>

                <button
                    id="logoutButton"
                    class="header-button logout-button"
                    title="Salir"
                >
                    🚪
                </button>

            </div>

        </header>


        <!-- CONTENIDO -->
  <main class="roulette-page">

    <div class="roulette-content">

        <div class="wheel-container">

            <div class="pointer"></div>

            <div id="wheel" class="wheel"></div>

        </div>

        <div id="winnerBox" class="winner-box">
            <span>ESPERANDO RESULTADO</span>
        </div>

    </div>

</main>

    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="participante.js"></script>

</body>
</html>
