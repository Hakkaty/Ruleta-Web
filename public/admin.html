<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Ruleta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN ADMIN -->
    <div id="adminLogin" class="screen">

        <div class="login-card">

            <div class="logo">👑</div>

            <h1>ADMINISTRADOR</h1>

            <p>Acceso privado</p>

            <input
                id="adminPassword"
                type="password"
                placeholder="Clave de administrador"
            >

            <button
                id="adminLoginButton"
                class="main-button admin-button"
            >
                INGRESAR
            </button>

            <div id="adminLoginMessage" class="message"></div>

        </div>

    </div>


    <!-- PANEL ADMIN -->
    <div id="adminPanel" class="admin-panel hidden">

        <!-- CABECERA -->
        <header class="admin-header">

           <div class="admin-title"> 
    👑 <strong>PANEL DE ADMINISTRADOR</strong>

    <button
        id="controlResultButton"
        class="header-button control-result-button"
        type="button"
    >
        🎛️ CONTROLAR RESULTADO
    </button>
</div>

            <div class="server-key">

                <span>CLAVE DE ACCESO</span>

                <strong id="serverKey">----</strong>

            </div>
<div class="header-buttons"> 
 
    <button 
        id="refreshButton" 
        class="header-button" 
    > 
        🔄 ACTUALIZAR 
    </button>

    <button 
        id="resetKeyButton" 
        class="header-button reset-key-button" 
    > 
        🔑 CAMBIAR CLAVE 
    </button>
 
    <button 
        id="logoutButton" 
        class="header-button logout-button" 
    > 
        🚪 SALIR 
    </button> 
 
</div>
        </header>


        <!-- CONTENIDO ADMIN -->
        <main class="admin-container">


            <!-- AGREGAR -->
            <section class="admin-card">

                <h2>➕ Registrar participante</h2>

                <div class="add-form">

                    <input
                        id="newName"
                        type="text"
                        maxlength="30"
                        placeholder="Nombre"
                    >

                    <input
                        id="newColor"
                        type="color"
                        value="#1e88e5"
                    >

                    <button
                        id="addParticipant"
                        class="main-button admin-button"
                    >
                        AGREGAR
                    </button>

                </div>

            </section>


            <div id="adminMessage" class="message"></div>


            <!-- PARTICIPANTES -->
            <section class="admin-card">

                <div class="participants-title">

                    <h2>👥 Participantes</h2>

                    <span id="participantCount">0</span>

                </div>

                <div
                    id="participantsList"
                    class="participants-list"
                ></div>

            </section>


            <!-- RULETA -->
            <section class="admin-card roulette-admin">

                <h2>🎡 Ruleta</h2>

<div class="admin-wheel-area">

    <div class="wheel-container">

        <div class="pointer"></div>

        <div id="adminWheel" class="wheel"></div>

    </div>

</div>

                <button
                    id="spinButton"
                    class="spin-button"
                >
                    🎡 GIRAR RULETA
                </button>
                <div id="countdown" class="countdown hidden"></div>

                <div
                    id="adminWinner"
                    class="winner-box"
                >
                    ESPERANDO
                </div>

         </section>

</main> 
    <!-- VENTANA CONTROLAR RESULTADO -->
<!-- VENTANA CONTROLAR RESULTADO - MODO DEMOSTRACIÓN -->

<div
    id="controlResultPanel"
    class="control-result-overlay hidden"
>
    <div class="control-result-window">

        <button
            id="closeControlResult"
            class="control-result-close"
            type="button"
        >
            ✕
        </button>

        <h3>🎛️ CONTROLAR RESULTADO</h3>

        <div class="demo-badge">
            MODO DEMOSTRACIÓN
        </div>

        <p class="control-result-description">
            Selecciona un participante para realizar una
            simulación visual del resultado.
        </p>

        <div class="control-result-info">
            <span>👥 Participantes</span>
            <strong id="controlParticipantCount">0</strong>
        </div>

        <label
            for="demoParticipant"
            class="control-result-label"
        >
            Seleccionar participante
        </label>

        <select
            id="demoParticipant"
            class="control-result-select"
        >
            <option value="">
                Selecciona un participante
            </option>
        </select>

        <button
            id="demoResultButton"
            class="demo-result-button"
            type="button"
        >
            🎯 SIMULAR RESULTADO
        </button>

        <div
            id="demoResultMessage"
            class="demo-result-message"
        ></div>

    </div>
</div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>

</body>
</html>
